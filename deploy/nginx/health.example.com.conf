# Nginx vhost for the bridge (BT Panel style paths).
# Replace HEALTH_HOST, adjust the certificate paths if your panel differs.
# The MCP server listens on 8788, the REST API on 8787, both on 127.0.0.1.

server {
    listen 80;
    server_name HEALTH_HOST;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/HEALTH_HOST;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name HEALTH_HOST;

    ssl_certificate     /www/server/panel/vhost/cert/HEALTH_HOST/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/HEALTH_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 4m;

    # MCP streamable HTTP: never buffer, allow long-lived responses.
    location /mcp {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # REST API + OpenAPI docs.
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
