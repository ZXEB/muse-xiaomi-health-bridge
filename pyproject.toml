[project]
name = "health-bridge"
version = "0.1.0"
description = "Read-only Xiaomi Mi Fitness data bridge for Meta Muse (MCP + REST)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mifit>=0.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mcp>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
